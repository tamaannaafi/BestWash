<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestWash - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-[#1E90FF] min-h-screen flex flex-col justify-between relative overflow-x-hidden"
  >
    <!-- Navbar Fixed & Responsive (Tanpa Tombol Log-in) -->
    <nav
      class="fixed top-0 left-0 right-0 z-50 bg-[#F4FDFC]/20 backdrop-blur-md border-b border-white/30 shadow-sm py-4 px-6 md:px-12"
    >
      <div class="flex items-center justify-between">
        <a
          href="landing_page.html"
          class="text-2xl md:text-3xl font-bold text-left text-black"
          >BestWash</a
        >

        <!-- Desktop Menu -->
        <ul class="hidden md:flex items-center gap-8 text-black">
          <a
            href="landing_page.html"
            class="text-base font-regular hover:underline underline-offset-5 inline-block"
            >Home</a
          >
          <a
            href="landing_page.html#services"
            class="text-base font-regular hover:underline underline-offset-5 inline-block"
            >Services</a
          >
          <a
            href="landing_page.html#price"
            class="text-base font-regular hover:underline underline-offset-5 inline-block"
            >Price</a
          >
          <a
            href="landing_page.html#contact"
            class="text-base font-regular hover:underline underline-offset-5 inline-block"
            >Contact Us</a
          >
        </ul>

        <!-- Mobile Hamburger Button -->
        <button
          id="menu-btn"
          class="block md:hidden text-black focus:outline-none p-2"
          aria-label="Toggle Menu"
        >
          <svg
            class="w-8 h-8"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        </button>
      </div>

      <!-- Mobile Dropdown Menu (Tanpa Tombol Log-in) -->
      <div
        id="mobile-menu"
        class="hidden md:hidden flex-col gap-4 mt-4 pt-4 border-t border-white/20 text-black"
      >
        <a
          href="landing_page.html"
          class="text-base font-regular hover:underline underline-offset-5 block"
          >Home</a
        >
        <a
          href="landing_page.html#services"
          class="text-base font-regular hover:underline underline-offset-5 block"
          >Services</a
        >
        <a
          href="landing_page.html#price"
          class="text-base font-regular hover:underline underline-offset-5 block"
          >Price</a
        >
        <a
          href="landing_page.html#contact"
          class="text-base font-regular hover:underline underline-offset-5 block"
          >Contact Us</a
        >
      </div>
    </nav>

    <!-- Main Content: Login Form Card -->
    <main
      class="flex-grow flex items-center justify-center pt-28 pb-36 px-4 z-10"
    >
      <div
        class="bg-[#F4FDFC]/20 backdrop-blur-md border border-white/30 shadow-sm rounded-3xl p-8 md:p-10 w-full max-w-md text-white"
      >
        <p class="text-xs md:text-sm font-medium mb-1 opacity-90">
          Welcome to BestWash
        </p>
        <h2 class="text-3xl md:text-4xl font-extrabold mb-8">Sign In</h2>

        <form action="#" method="POST" class="space-y-6">
          <!-- Username Input -->
          <div>
            <label class="block text-lg font-bold mb-2">Username</label>
            <div class="relative flex items-center">
              <span class="absolute left-4 text-gray-400">
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                  ></path>
                </svg>
              </span>
              <input
                type="text"
                placeholder="Masukkan Username"
                class="w-full bg-white text-black pl-11 pr-4 py-3 rounded-full text-sm font-medium placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#93E1E3]"
                required
              />
            </div>
          </div>

          <!-- Password Input -->
          <div>
            <label class="block text-lg font-bold mb-2">Password</label>
            <div class="relative flex items-center">
              <span class="absolute left-4 text-gray-400">
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                  ></path>
                </svg>
              </span>
              <input
                type="password"
                id="password"
                placeholder="Masukkan Password"
                class="w-full bg-white text-black pl-11 pr-11 py-3 rounded-full text-sm font-medium placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#93E1E3]"
                required
              />
              <button
                type="button"
                id="toggle-password"
                class="absolute right-4 text-gray-400 hover:text-gray-600 focus:outline-none"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.007 10.007 0 013.682-.78c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18"
                  ></path>
                </svg>
              </button>
            </div>
            <div class="text-right mt-1">
              <a href="#" class="text-xs text-white/90 hover:underline"
                >Lupa Password</a
              >
            </div>
          </div>

          <!-- Submit Button -->
          <div class="pt-2">
            <button
              type="submit"
              class="w-full bg-white text-black font-extrabold text-lg py-3 rounded-full hover:bg-gray-100 transition duration-300 shadow-md"
            >
              Sign In
            </button>
          </div>

          <!-- Register Link -->
          <div class="text-center text-xs mt-4">
            <p class="text-white/80">
              Tidak Punya Akun?
              <a
                href="register.html"
                class="font-bold text-white hover:underline ml-1"
                >Sign Up</a
              >
            </p>
          </div>
        </form>
      </div>
    </main>

    <!-- Wave Bottom -->
    <div
      class="absolute bottom-0 left-0 w-full leading-none overflow-hidden z-0"
    >
      <svg
        class="relative block w-full h-[80px] md:h-[140px]"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 1200 120"
        preserveAspectRatio="none"
      >
        <path
          d="M0,0 C150,90 350,120 600,60 C850,0 1050,30 1200,90 L1200,120 L0,120 Z"
          class="fill-[#93E1E3]"
        ></path>
      </svg>
    </div>

    <!-- Panggil File JavaScript Utama -->
    <script src="script.js"></script>
  </body>
</html>
