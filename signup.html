<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up - BestWash</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
// Konfigurasi Tailwind bersama (dimuat setelah script Tailwind CDN)
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        nav: '#4DA6FF',
        brand: '#1E90FF',
        navy: '#0B4A7D',
        heading: '#0E5FB5',
        aqua: '#97E3E3',
      },
    },
  },
};
  </script>
</head>

<body class="relative min-h-screen overflow-x-hidden bg-brand font-sans text-black antialiased">
  <!-- NAVBAR -->
  <header class="relative z-10 bg-nav">
    <nav class="mx-auto flex max-w-6xl flex-nowrap items-center justify-between gap-3 px-3 py-3 sm:gap-6 sm:px-6 sm:py-4">
      <a href="landingpage.html" class="shrink-0 text-lg font-bold sm:text-2xl">BestWash</a>

      <ul class="flex items-center gap-2 text-xs font-semibold sm:gap-5 sm:text-base">
        <li><a href="landingpage.html" class="hover:underline focus-visible:underline focus:outline-none">Home</a></li>
        <li><a href="landingpage.html#services" class="hover:underline focus-visible:underline focus:outline-none">Services</a></li>
        <li><a href="landingpage.html#price" class="hover:underline focus-visible:underline focus:outline-none">Price</a></li>
        <li><a href="landingpage.html#contact" class="hover:underline focus-visible:underline focus:outline-none">Contact Us</a></li>
      </ul>

      <a href="login.html" class="inline-block shrink-0 rounded-full bg-black px-3 py-1.5 text-xs font-bold text-white focus:outline-none focus-visible:ring-4 focus-visible:ring-white/70 sm:px-5 sm:py-2 sm:text-base">Log-in</a>
    </nav>
  </header>

  <!-- FORM SIGN UP -->
  <main class="relative z-10 flex justify-center px-5 pb-32 pt-8 sm:pt-10">
    <form id="form-auth" action="login.html" method="get" novalidate class="w-full max-w-sm rounded-3xl border border-white/50 bg-white/20 p-7 shadow-lg backdrop-blur-sm">
      <p class="text-sm font-semibold text-white">Welcome to BestWash</p>
      <h1 class="text-3xl font-bold text-white">Sign Up</h1>

      <!-- Username -->
      <div class="mt-6">
        <label for="username" class="block text-xl font-bold text-white">Username</label>
        <div class="relative mt-2">
          <svg class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input id="username" type="text" autocomplete="username" required placeholder="Masukkan Username"
            class="h-11 w-full rounded-full bg-white pl-10 pr-4 text-sm text-black placeholder:text-gray-400 focus:outline-none focus:ring-4 focus:ring-white/60" />
        </div>
      </div>

      <!-- Email -->
      <div class="mt-4">
        <label for="email" class="block text-xl font-bold text-white">Email</label>
        <div class="relative mt-2">
          <svg class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <input id="email" type="email" autocomplete="email" required placeholder="Masukkan Email"
            class="h-11 w-full rounded-full bg-white pl-10 pr-4 text-sm text-black placeholder:text-gray-400 focus:outline-none focus:ring-4 focus:ring-white/60" />
        </div>
      </div>

      <!-- Password -->
      <div class="mt-4">
        <label for="password" class="block text-xl font-bold text-white">Password</label>
        <div class="relative mt-2">
          <svg class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input id="password" type="password" autocomplete="new-password" required minlength="6" placeholder="Masukkan Password (min. 6 karakter)"
            class="h-11 w-full rounded-full bg-white pl-10 pr-11 text-sm text-black placeholder:text-gray-400 focus:outline-none focus:ring-4 focus:ring-white/60" />
          <button type="button" id="toggle-pass" aria-label="Tampilkan password" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-black focus:outline-none">
            <svg id="eye-off" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.1A10.6 10.6 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.2 3.8M6.6 6.6A16.6 16.6 0 0 0 2.5 12S6 18 12 18c1.5 0 2.8-.4 4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            <svg id="eye-on" class="hidden h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          </div>
      </div>

      <!-- Konfirmasi Password -->
      <div class="mt-4">
        <label for="confirm" class="block text-xl font-bold text-white">Konfirmasi Password</label>
        <div class="relative mt-2">
          <svg class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input id="confirm" type="password" autocomplete="new-password" required placeholder="Ulangi Password"
            class="h-11 w-full rounded-full bg-white pl-10 pr-4 text-sm text-black placeholder:text-gray-400 focus:outline-none focus:ring-4 focus:ring-white/60" />
        </div>
      </div>

      <p id="error" role="alert" class="mt-3 hidden rounded-xl bg-red-600/80 px-3 py-2 text-sm font-semibold text-white"></p>

      <button type="submit" class="mt-7 w-full rounded-full bg-[#F4FBFF] py-3 text-xl font-bold text-black transition hover:bg-white focus:outline-none focus-visible:ring-4 focus-visible:ring-white/70">
        Sign Up
      </button>

      <p class="mt-3 text-center text-xs text-white">
        Sudah Punya Akun?
        <a data-keep href="login.html" class="block text-sm font-semibold underline">Sign In</a>
      </p>
    </form>
  </main>

  <!-- WAVE DECORATION -->
  <div class="pointer-events-none absolute inset-x-0 bottom-0 leading-[0]" aria-hidden="true">
    <svg viewBox="0 0 1440 260" preserveAspectRatio="none" class="h-40 w-full md:h-56" xmlns="http://www.w3.org/2000/svg">
      <path fill="#97E3E3" d="M0 90 C 260 10, 520 10, 760 70 S 1200 190, 1440 40 L1440 260 L0 260 Z" />
    </svg>
  </div>

  <script>
    // ===== BestWash: login + penyimpanan data di browser (localStorage) =====
    const Auth = {
      KEY: 'bestwash_user', ROLE: 'bestwash_role',
      get() { try { return localStorage.getItem(this.ROLE) === 'admin' ? null : localStorage.getItem(this.KEY); } catch (e) { return null; } },
      isAdmin() { try { return localStorage.getItem(this.ROLE) === 'admin'; } catch (e) { return false; } },
      set(name, role) { try { localStorage.setItem(this.KEY, name); localStorage.setItem(this.ROLE, role || 'user'); } catch (e) {} },
      clear() { try { localStorage.removeItem(this.KEY); localStorage.removeItem(this.ROLE); } catch (e) {} },
    };
    // Halaman tujuan setelah login (hanya file .html lokal)
    function nextPage(fallback) {
      const n = new URLSearchParams(location.search).get('next');
      return n && /^[\w-]+\.html(\?[\w=&%.+-]*)?$/.test(n) ? n : fallback;
    }

    const STATUS = ['Pesanan Diterima', 'Penimbangan & Penilaian', 'Proses Cuci & Pengeringan', 'Setrika & Packaging', 'Siap Diambil / Diantar', 'Selesai'];
    const DEFAULT_SERVICES = [
      { id: 'reguler', nama: 'Cuci Reguler', harga: 9000, fitur: ['Cuci + Kering', 'Wangi & Bersih', 'Siap Dipakai'], aktif: true },
      { id: 'setrika', nama: 'Cuci + Setrika', harga: 12000, fitur: ['Cuci + Kering', 'Setrika Rapi', 'Wangi Tahan Lama'], aktif: true },
      { id: 'express', nama: 'Express', harga: 15000, fitur: ['Lebih Cepat', 'Cuci + Kering', 'Setrika Rapi'], aktif: true },
    ];
    const DEFAULT_SETTINGS = { wa: '6281234567890', telp: '0812-3456-7890', alamat: 'Jl. Contoh No. 123, Kota Anda', jam: 'Setiap hari, 07.00 - 21.00', ongkir: 7000 };
    const rp = (n) => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const DB = {
      load(k, def) { try { const v = localStorage.getItem('bestwash_' + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
      save(k, v) { try { localStorage.setItem('bestwash_' + k, JSON.stringify(v)); } catch (e) {} },
      services() { let s = this.load('services', null); if (!s) { s = DEFAULT_SERVICES; this.save('services', s); } return s; },
      saveServices(s) { this.save('services', s); },
      settings() { return Object.assign({}, DEFAULT_SETTINGS, this.load('settings', {})); },
      saveSettings(o) { this.save('settings', o); },
      orders() { return this.load('orders', []); },
      saveOrders(o) { this.save('orders', o); },
      customers() { return this.load('customers', []); },
      addCustomer(username, email) {
        const list = this.customers();
        const c = list.find((x) => x.username.toLowerCase() === username.toLowerCase());
        if (c) { if (email && !c.email) c.email = email; } else list.push({ username, email: email || '', joinedAt: new Date().toISOString() });
        this.save('customers', list);
      },
      addOrder(d) {
        const list = this.orders();
        const t = new Date();
        const ymd = t.getFullYear() + String(t.getMonth() + 1).padStart(2, '0') + String(t.getDate()).padStart(2, '0');
        const prefix = 'BW-' + ymd + '-';
        const seq = list.filter((o) => o.id.indexOf(prefix) === 0).reduce((m, o) => Math.max(m, parseInt(o.id.slice(prefix.length), 10) || 0), 0) + 1;
        const now = t.toISOString();
        const o = Object.assign({ status: 0, createdAt: now, updatedAt: now }, d, { id: prefix + String(seq).padStart(3, '0') });
        list.push(o);
        this.saveOrders(list);
        return o;
      },
    };

    // Jalankan fn setiap data berubah (dari tab lain lewat event 'storage', atau lewat pengecekan berkala)
    function watch(fn) {
      const snap = () => { try { return ['orders', 'services', 'settings', 'customers'].map((k) => localStorage.getItem('bestwash_' + k)).join('|'); } catch (e) { return ''; } };
      let last = snap();
      const check = () => { const now = snap(); if (now !== last) { last = now; fn(); } };
      window.addEventListener('storage', check);
      setInterval(check, 1500);
    }

    // Form pemesanan dengan perhitungan biaya real-time (dipakai pemesanan.html & dashboard.html)
    function initOrderForm(form, opt) {
      const q = (s) => form.querySelector(s);
      const settings = DB.settings();
      const svcs = DB.services().filter((s) => s.aktif);
      const list = q('[data-paket-list]');
      const want = new URLSearchParams(location.search).get('paket');
      const sel = svcs.find((s) => s.id === want) || svcs[0];
      const icons = ['<path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/>', '<path d="M8 3l-5 4 3 3 2-1v12h8V9l2 1 3-3-5-4a4 4 0 0 1-8 0z"/>', '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'];
      list.innerHTML = svcs.length ? svcs.map((s, i) => `<label class="cursor-pointer"><input type="radio" name="paket" value="${esc(s.id)}" class="peer sr-only"${s === sel ? ' checked' : ''} /><span class="flex h-full flex-col items-center gap-1 rounded-2xl border-2 border-slate-200 bg-white p-3 text-center text-sm font-bold text-slate-700 transition ${opt.checked} peer-focus-visible:ring-4 peer-focus-visible:ring-sky-200"><svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[i % 3]}</svg><span>${esc(s.nama)}</span><span class="text-xs font-semibold text-slate-500">${rp(s.harga)} / kg</span></span></label>`).join('') : '<p class="text-sm text-slate-500">Belum ada layanan aktif.</p>';
      form.querySelectorAll('[data-ongkir-label]').forEach((el) => { el.textContent = rp(settings.ongkir); });

      const set = (k, v) => { const el = q('[data-sum="' + k + '"]'); if (el) el.textContent = v; };
      const calc = () => {
        const r = q('input[name="paket"]:checked');
        const svc = svcs.find((s) => r && s.id === r.value);
        const berat = Math.min(50, Math.max(0, parseFloat(q('#berat').value) || 0));
        const antar = q('[name="antar_jemput"]').checked;
        const biaya = svc ? svc.harga * berat : 0;
        const ongkir = antar ? settings.ongkir : 0;
        return { svc, berat, antar, biaya, ongkir, total: biaya + ongkir };
      };
      const paint = () => {
        const c = calc();
        set('rincian', rp(c.biaya)); set('ongkir', rp(c.ongkir)); set('total', rp(c.total));
        set('caption', c.svc ? 'Estimasi: ' + c.berat.toLocaleString('id-ID') + ' kg ' + c.svc.nama : 'Pilih paket cucian');
        const al = q('#alamat');
        if (al) { al.required = c.antar; if (al.hasAttribute('data-toggle')) al.classList.toggle('hidden', !c.antar); }
      };
      form.addEventListener('input', paint);
      form.addEventListener('change', paint);
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const c = calc();
        if (!c.svc) return;
        const v = (s) => { const el = q(s); return el ? el.value.trim() : ''; };
        const me = Auth.get();
        const order = DB.addOrder({ user: me, nama: v('#nama') || me, hp: v('#hp'), paketId: c.svc.id, paket: c.svc.nama, harga: c.svc.harga, berat: c.berat, parfum: v('#parfum'), antar: c.antar, ongkir: c.ongkir, biaya: c.biaya, total: c.total, alamat: v('#alamat'), catatan: v('#catatan') });
        opt.onDone(order);
      });
      paint();
      return paint;
    }
  </script>
  <script>
    const form = document.getElementById('form-auth');
    const errorBox = document.getElementById('error');
    const pass = document.getElementById('password');
    const $ = (id) => document.getElementById(id);
    function showError(msg) { errorBox.textContent = msg; errorBox.classList.remove('hidden'); }

    // Bawa parameter ?next= saat pindah antara Sign In dan Sign Up
    document.querySelectorAll('a[data-keep]').forEach((a) => { a.href += location.search; });

    $('toggle-pass').addEventListener('click', () => {
      const show = pass.type === 'password';
      pass.type = show ? 'text' : 'password';
      $('eye-on').classList.toggle('hidden', !show);
      $('eye-off').classList.toggle('hidden', show);
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = $('username').value.trim();
      const email = $('email').value.trim();
      if (!username || !email || !pass.value || !$('confirm').value) return showError('Semua kolom wajib diisi.');
      if (!/^\S+@\S+\.\S+$/.test(email)) return showError('Format email belum benar.');
      if (pass.value.length < 6) return showError('Password minimal 6 karakter.');
      if (pass.value !== $('confirm').value) return showError('Konfirmasi password tidak sama.');
      if (username.toLowerCase() === 'admin') return showError('Username tidak tersedia.');
      Auth.set(username, 'user');   // nama ini tampil di navbar & dashboard
      DB.addCustomer(username, email);
      location.href = nextPage('landingpage.html');
    });
  </script>
</body>
</html>
