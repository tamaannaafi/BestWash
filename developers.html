<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestWash - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-[#1E90FF] min-h-screen flex flex-col justify-between relative overflow-x-hidden"
  >
    <!-- Navbar Fixed & Responsive -->
    <nav
      class="fixed top-0 left-0 right-0 z-50 bg-[#F4FDFC]/20 backdrop-blur-md border-b border-white/30 shadow-sm py-4 px-6 md:px-10"
    >
      <div class="flex items-center justify-between">
        <a
          href="landing_page.html"
          class="text-2xl md:text-3xl font-bold text-left"
          >BestWash</a
        >

        <!-- Desktop Menu -->
        <ul class="hidden md:flex items-center gap-5">
          <a
            href="landing_page.html"
            class="text-lg font-regular hover:underline underline-offset-5 inline-block"
            >Home</a
          >
          <a
            href="landing_page.html#services"
            class="text-lg font-regular hover:underline underline-offset-5 inline-block"
            >Services</a
          >
          <a
            href="landing_page.html#price"
            class="text-lg font-regular hover:underline underline-offset-5 inline-block"
            >Price</a
          >
          <a
            href="landing_page.html#contact"
            class="text-lg font-regular hover:underline underline-offset-5 inline-block"
            >Contact Us</a
          >
        </ul>

        <!-- Desktop CTA Button -->
        <a
          href="login.html"
          class="hidden md:block bg-[#000000] text-[#F4FDFC] px-5 py-2 rounded-full font-semibold hover:bg-[#383636] transition duration-300"
        >
          Pesan Sekarang
        </a>

        <!-- Mobile Hamburger Button -->
        <button
          id="menu-btn"
          class="block md:hidden text-black focus:outline-none p-2"
          aria-label="Toggle Menu"
        >
          <svg
            class="w-8 h-8"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        </button>
      </div>

      <!-- Mobile Dropdown Menu -->
      <div
        id="mobile-menu"
        class="hidden md:hidden flex-col gap-4 mt-4 pt-4 border-t border-white/20"
      >
        <a
          href="landing_page.html"
          class="text-lg font-regular hover:underline underline-offset-5 block"
          >Home</a
        >
        <a
          href="landing_page.html#services"
          class="text-lg font-regular hover:underline underline-offset-5 block"
          >Services</a
        >
        <a
          href="landing_page.html#price"
          class="text-lg font-regular hover:underline underline-offset-5 block"
          >Price</a
        >
        <a
          href="landing_page.html#contact"
          class="text-lg font-regular hover:underline underline-offset-5 block"
          >Contact Us</a
        >
        <a
          href="login.html"
          class="w-full bg-[#000000] text-[#F4FDFC] px-5 py-2 rounded-full font-semibold hover:bg-[#383636] transition duration-300 mt-2"
        >
          Pesan Sekarang
        </a>
      </div>
    </nav>

    <section
      class="bg-[#1E90FF] min-h-screen flex flex-col justify-center py-20 px-6 md:px-12 relative"
    >
      <div class="max-w-6xl mx-auto w-full z-10">
        <!-- Grid Card Developer (3 Kolom) -->
        <div
          class="grid grid-cols-1 md:grid-cols-3 gap-8 md:gap-10 items-stretch"
        >
          <!-- Card 1: Elvian Fihandio Oemardi -->
          <div
            class="rounded-3xl overflow-hidden shadow-xl flex flex-col bg-[#1E90FF]/30 backdrop-blur-md border border-white/20 hover:scale-105 transition-transform duration-300"
          >
            <!-- Header Card: Foto Setengah Bagian Card -->
            <div class="h-56 md:h-64 w-full overflow-hidden">
              <img
                src="path/to/elvian.jpg"
                alt="Foto Elvian Fihandio Oemardi"
                class="w-full h-full object-cover"
              />
            </div>

            <!-- Body Card -->
            <div
              class="p-6 flex flex-col gap-3 justify-center text-[#F4FDFC] font-semibold text-sm md:text-base flex-grow"
            >
              <!-- Role -->
              <div
                class="bg-white/20 rounded-full py-2 px-4 text-center text-[#F4FDFC] font-bold"
              >
                Front End Developer
              </div>
              <!-- Instagram Link -->
              <a
                href="https://instagram.com/one_mar1013"
                target="_blank"
                rel="noopener noreferrer"
                class="bg-white/20 hover:bg-white/30 transition-colors rounded-full py-2 px-4 flex justify-between items-center group"
              >
                <span>Instagram</span>
                <span class="font-normal text-white/90">@one_mar1013</span>
              </a>
              <!-- GitHub Link -->
              <a
                href="https://github.com/ELvianFO"
                target="_blank"
                rel="noopener noreferrer"
                class="bg-white/20 hover:bg-white/30 transition-colors rounded-full py-2 px-4 flex justify-between items-center group"
              >
                <span>GitHub</span>
                <span class="font-normal text-white/90">@ELvianFO</span>
              </a>
            </div>
          </div>

          <!-- Card 2: Prawiratama Annaafi -->
          <div
            class="rounded-3xl overflow-hidden shadow-xl flex flex-col bg-[#1E90FF]/30 backdrop-blur-md border border-white/20 hover:scale-105 transition-transform duration-300"
          >
            <!-- Header Card: Foto Setengah Bagian Card -->
            <div class="h-56 md:h-64 w-full overflow-hidden">
              <img
                src="photo/tama.png"
                alt="Foto Prawiratama Annaafi"
                class="w-full h-full object-cover"
              />
            </div>

            <!-- Body Card -->
            <div
              class="p-6 flex flex-col gap-3 justify-center text-[#F4FDFC] font-semibold text-sm md:text-base flex-grow"
            >
              <!-- Role -->
              <div
                class="bg-white/20 rounded-full py-2 px-4 text-center text-[#F4FDFC] font-bold"
              >
                Back End Developer
              </div>
              <!-- Instagram Link -->
              <a
                href="https://instagram.com/tamxzy_"
                target="_blank"
                rel="noopener noreferrer"
                class="bg-white/20 hover:bg-white/30 transition-colors rounded-full py-2 px-4 flex justify-between items-center group"
              >
                <span>Instagram</span>
                <span class="font-normal text-white/90">@tamxzy_</span>
              </a>
              <!-- GitHub Link -->
              <a
                href="https://github.com/tamaannaafi"
                target="_blank"
                rel="noopener noreferrer"
                class="bg-white/20 hover:bg-white/30 transition-colors rounded-full py-2 px-4 flex justify-between items-center group"
              >
                <span>GitHub</span>
                <span class="font-normal text-white/90">@tamaannaafi</span>
              </a>
            </div>
          </div>

          <!-- Card 3: Andika Putra Rabbani -->
          <div
            class="rounded-3xl overflow-hidden shadow-xl flex flex-col bg-[#1E90FF]/30 backdrop-blur-md border border-white/20 hover:scale-105 transition-transform duration-300"
          >
            <!-- Header Card: Foto Setengah Bagian Card -->
            <div class="h-56 md:h-64 w-full overflow-hidden">
              <img
                src="path/to/andika.jpg"
                alt="Foto Andika Putra Rabbani"
                class="w-full h-full object-cover"
              />
            </div>

            <!-- Body Card -->
            <div
              class="p-6 flex flex-col gap-3 justify-center text-[#F4FDFC] font-semibold text-sm md:text-base flex-grow"
            >
              <!-- Role -->
              <div
                class="bg-white/20 rounded-full py-2 px-4 text-center text-[#F4FDFC] font-bold"
              >
                UI/UX Designer
              </div>
              <!-- Instagram Link -->
              <a
                href="https://instagram.com/andhikarbbni"
                target="_blank"
                rel="noopener noreferrer"
                class="bg-white/20 hover:bg-white/30 transition-colors rounded-full py-2 px-4 flex justify-between items-center group"
              >
                <span>Instagram</span>
                <span class="font-normal text-white/90">@andhikarbbni</span>
              </a>
              <!-- GitHub Link -->
              <a
                href="https://github.com/AndhikaPutraR03"
                target="_blank"
                rel="noopener noreferrer"
                class="bg-white/20 hover:bg-white/30 transition-colors rounded-full py-2 px-4 flex justify-between items-center group"
              >
                <span>GitHub</span>
                <span class="font-normal text-white/90">@AndhikaPutraR03</span>
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Tombol Kembali ke Landing Page -->
      <div class="mt-10 text-center">
        <a
          href="landing_page.html"
          class="inline-flex items-center gap-2 rounded-full bg-[#000000] px-6 py-3 text-base font-bold text-[#F4FDFC] shadow-md hover:bg-[#383636] transition duration-300"
        >
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          Kembali
        </a>
      </div>
    </section>

    <!-- Panggil File JavaScript Utama -->
    <script src="script.js"></script>
  </body>
</html>
